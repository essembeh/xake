name: Build & Tests

on: [push]

env:
  REGISTRY: ghcr.io

jobs:
  # Same commands as `just check`
  python-check:
    name: Lint, format and typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync mypy src tests

  # Same command as `just test`
  python-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync -- pytest --cov=xake --cov-report=term-missing

  # Same command as `just audit`
  python-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informative for now: a new advisory must not block a release by itself
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync -- pip-audit

  # Same commands as `just chart`
  helm-lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint --strict charts/xake
      - run: helm template xake charts/xake --set ingress.enabled=true --set autoscaling.enabled=true > /dev/null

  docker-build:
    name: Build docker image
    needs: [python-check, python-test, helm-lint]
    # The token of the run is enough to push to ghcr.io, once the package grants this repository write access
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/essembeh/xake
          # No per-commit tag: a rebuilt branch untags its previous image, which ghcr-cleanup deletes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  # GHCR keeps every version forever: drop the images no tag points to any more (single-manifest images,
  # so no untagged child of a tagged index). Needs the Admin role for this repository in the package settings.
  ghcr-cleanup:
    name: Delete untagged images
    needs: docker-build
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: xake
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: "true"

  # Optional: without the RENDER_DEPLOY_HOOK_URL secret there is no demo instance and nothing happens
  demo-deploy:
    name: Redeploy the demo instance
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy the image just built from main
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "No demo instance configured"
            exit 0
          fi
          # The hook URL is a secret: its answer is not printed
          curl --fail --silent --show-error --output /dev/null \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=ghcr.io%2Fessembeh%2Fxake%3Amain"

  # Publishes the chart to the gh-pages branch (Helm repository https://essembeh.github.io/xake/)
  helm-release:
    name: Update Helm repository
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: docker-build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
