name: Build & Tests

on: [push]

env:
  REGISTRY: ghcr.io

jobs:
  # Same command as `npm run lint`
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Same command as `npm test`: the engines only run in a browser (spec 007 §2.8)
  e2e:
    name: Smoke test in Chromium and WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # Maia networks from Hugging Face, fetched again only when their pinned list changes
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/maia
          key: maia-${{ hashFiles('scripts/fetch-maia.sh') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Build docker image
    needs: [lint, e2e]
    # The token of the run is enough to push to ghcr.io, once the package grants this repository write access
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/essembeh/xake
          # No per-commit tag: a rebuilt branch untags its previous image, which ghcr-cleanup deletes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: xake:ci
          load: true
      # What the image adds to the build: settings from XAKE_*, headers, MIME types, root icons
      - name: Test the image
        run: |
          docker run -d --name xake -p 8000:8000 -e XAKE_DEFAULT_LANGUAGE=fr xake:ci
          sleep 2
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/config.js | grep -q '"fr"'
          curl -fsSI http://localhost:8000/ | grep -qi '^cache-control: no-cache'
          curl -fsSI http://localhost:8000/stockfish/stockfish-19-lite-single.wasm | grep -qi '^content-type: application/wasm'
          curl -fsSI http://localhost:8000/apple-touch-icon-precomposed.png | grep -qi '^content-type: image/png'
          bundle=$(curl -fsS http://localhost:8000/ | grep -oE 'assets/index-[^"]+\.js' | head -1)
          curl -fsSI "http://localhost:8000/$bundle" | grep -qi '^cache-control: .*immutable'
          ! docker run --rm -e XAKE_DEFAULT_ELO=99 xake:ci
      - name: Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  # GHCR keeps every version forever: drop the images no tag points to any more (single-manifest images,
  # so no untagged child of a tagged index). Needs the Admin role for this repository in the package settings.
  ghcr-cleanup:
    name: Delete untagged images
    needs: docker-build
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: xake
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: "true"

  # The demo: main published on GitHub Pages (Settings → Pages → Source: GitHub Actions)
  pages:
    name: Deploy the demo on GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [lint, e2e]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/maia
          key: maia-${{ hashFiles('scripts/fetch-maia.sh') }}
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
