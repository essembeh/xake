# Default values for xake.

replicaCount: 1

xake:
  image:
    repository: ghcr.io/essembeh/xake
    # tag: main
    pullPolicy: IfNotPresent
  logLevel: INFO
  # XAKE_DEFAULT_LANGUAGE: UI language (en or fr) for browsers in another language, until a user picks one
  defaultLanguage: en
  # XAKE_DEFAULT_ELO: Stockfish level of a first visit (400 to 3190), then each browser remembers its own
  defaultElo: 1500
  # XAKE_PLAY_MOVETIME_MS: thinking time of the opponent per move (Stockfish runs in each player's browser)
  playMovetimeMs: 300

  # Additional environment variables for the container
  extraEnv: []
  # - name: XAKE_DEFAULT_ELO
  #   value: "1200"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # The application never talks to the Kubernetes API
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as an unprivileged user and only writes to /tmp (an emptyDir)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # The API is open: anyone reaching it spends the cluster CPU, an auth in front is advised
    # traefik.ingress.kubernetes.io/router.middlewares: auth-forward-auth@kubernetescrd
    # nginx.ingress.kubernetes.io/auth-url: https://auth.example.com/oauth2/auth
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # Stockfish runs in the players' browsers: the pod only serves static files and /config.js
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 192Mi

# The pods share nothing: games live in the browsers, any pod can answer any request
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
