# Xake static site (spec 007 §2.5): hashed bundles cached for good, everything else revalidated.
server {
    listen 8000;
    listen [::]:8000;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control "no-cache" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Written at start from the XAKE_* variables (40-xake-config.sh)
    location = /config.js {
        alias /tmp/xake/config.js;
    }

    # iOS probes these root paths when adding to the home screen, whatever the page declares (spec 001, PWA)
    location ~ ^/apple-touch-icon(-\d+x\d+)?(-precomposed)?\.png$ {
        try_files /icons/apple-touch-icon.png =404;
    }
    location = /favicon.ico {
        default_type image/png;
        try_files /icons/icon-192.png =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
